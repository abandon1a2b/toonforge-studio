<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分镜合集审阅 · Toonforge</title>
<style>body{margin:0;background:#edf0f4;color:#202734;font:16px/1.7 system-ui,sans-serif}header{background:white;padding:24px 5%}h1{margin:0;font-size:27px}main{max-width:1500px;margin:auto;padding:24px 3%}article{background:white;margin-bottom:32px;border:1px solid #d7dce3;border-radius:10px;overflow:hidden}article>h2,article>p{margin:18px 24px}img{width:100%;height:auto;display:block}details{margin:20px 24px}summary{cursor:pointer;font-weight:600}.shot{border-top:1px solid #e0e4eb;padding:14px 0}.shot h3{margin:0;font-size:18px}p{margin:6px 0}.hint{color:#626c7c}a{color:#335c9b}</style>
<header><h1 id="title">分镜合集审阅</h1><p id="status">读取中…</p><p class="hint">整张合集原图展示，尚未验收；点击图片查看原图。逐镜说明在每页下方展开。</p><a href="/">返回素材库</a></header><main id="pages"></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{try{const id=new URLSearchParams(location.search).get('story');if(!id)throw Error('缺少story参数');const response=await fetch('/api/collection?story='+encodeURIComponent(id));const data=await response.json();if(!response.ok)throw Error(data.error||'读取失败');document.querySelector('#title').textContent=data.title+' · 分镜合集';document.querySelector('#status').textContent=`${data.page_count??data.pages.length} 张合集 · ${data.shot_count??'—'} 镜 · ${data.status==='pending_user_review'?'待用户审阅':data.status}`;document.querySelector('#pages').innerHTML=data.pages.map(page=>{const url='/media?path='+encodeURIComponent(page.image);return `<article><h2>${esc(page.id)} · ${esc(page.title)}</h2><a href="${esc(url)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(url)}" alt="${esc(page.title||page.id)}"></a>${page.notes?`<p class="hint">${esc(page.notes)}</p>`:''}<details><summary>展开逐镜说明与对白 · ${esc((page.shot_ids||[]).join('、'))}</summary>${(page.shots||[]).map(shot=>`<div class="shot"><h3>${esc(shot.shot_id)} · ${esc(shot.title)}</h3><p>${esc(shot.direction)}</p>${(shot.dialogue||[]).map(line=>`<p><b>${esc(line.character_id)}</b>：${esc(line.text)}</p>`).join('')}${shot.old_shot_id?`<p class="hint">原镜头参考：${esc(shot.old_shot_id)}</p>`:''}</div>`).join('')}</details></article>`}).join('')}catch(e){document.querySelector('#status').textContent=e.message}})();
</script></html>
