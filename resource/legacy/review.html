<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分镜审阅 · Toonforge</title>
<style>body{margin:0;background:#eef0f3;color:#202734;font:16px/1.6 system-ui,sans-serif}header{padding:28px 5%;background:#fff;border-bottom:1px solid #d7dce3}h1{margin:0;font-size:26px}#summary{color:#5c6574}main{max-width:1500px;margin:24px auto;padding:0 3%;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px}article{background:#fff;border-radius:10px;overflow:hidden;border:1px solid #d7dce3}img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#f7f7f7}.text{padding:16px}h2{font-size:19px;margin:0}p{margin:8px 0}.direction{font-size:14px;color:#5c6574}.dialogue{border-left:3px solid #6e83a5;padding-left:10px}.empty{padding:50px;color:#5c6574}a{color:#335c9b}small{color:#697181}</style>
<header><h1 id="title">分镜审阅</h1><p id="summary">正在读取素材索引…</p><a href="/">返回素材库</a></header><main id="shots"></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{try{const response=await fetch('/api/catalog');if(!response.ok)throw Error('索引读取失败');const data=await response.json();const wanted=new URLSearchParams(location.search).get('story');const story=data.stories.find(s=>s.id===wanted);if(!story)throw Error('未找到指定故事，请通过 ?story=故事ID 打开');document.querySelector('#title').textContent=story.title;document.querySelector('#summary').textContent=`共 ${story.shots.length} 镜 · 分镜候选，未验收 · 点击画面查看原图 · 台词仅供演出审阅，未生成新配音`;
const assets=new Map(data.assets.map(a=>[a.id,a]));document.querySelector('#shots').innerHTML=[...story.shots].sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true})).map(shot=>{const asset=assets.get(shot.image),r=asset?.relations.find(r=>r.story===story.id&&r.shot===shot.id)||{};const path=shot.image?'/media?path='+encodeURIComponent(shot.image):null;return `<article>${path?`<a href="${esc(path)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(path)}" alt="${esc(shot.id)}"></a>`:'<div class="empty">画面待补</div>'}<div class="text"><h2>${esc(shot.id)}${r.duration_seconds!=null?' · '+esc(r.duration_seconds)+' 秒':''}</h2><p class="direction">${esc(r.direction||'')}</p>${(shot.dialogue||[]).map(v=>`<div class="dialogue"><p><b>${esc(data.characters[v.character]?.name||v.character)}</b>：${esc(v.text)}</p><small>演出：${esc(v.direction)} · ${v.audio_status==='not_generated'?'未生成配音':esc(v.audio_status)}</small></div>`).join('')}${!shot.dialogue?.length?'<small>无台词／动作与反应镜头</small>':''}</div></article>`}).join('');}catch(e){document.querySelector('#summary').textContent=e.message;}})();
</script></html>
